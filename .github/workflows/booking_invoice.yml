name: Booking faktury – 10. den v měsíci

on:
  schedule:
    - cron: '0 8 10 * *'
  workflow_dispatch:

jobs:
  download-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nainstaluj zavislosti
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Spust skript
        env:
          BOOKING_COOKIES:    ${{ secrets.BOOKING_COOKIES }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python booking_automation.py

      - name: Uloz screenshots pri chybe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
